import java.security.MessageDigest
import java.util.jar.JarFile
import java.nio.charset.StandardCharsets

plugins {
    id 'dev.architectury.loom'
    id 'architectury-plugin'
    id 'com.github.johnrengelman.shadow'
    id 'maven-publish'
}

def hashGeneratedDir = layout.buildDirectory.dir("generated/selfhash")

architectury {
    minecraft = rootProject.minecraft_version
}

configurations {
    shadowOnly
}

dependencies {
    shadowOnly "net.minidev:json-smart:${rootProject.json_smart_version}"
    shadowOnly "net.minidev:accessors-smart:${rootProject.json_smart_version}"

    shadowOnly (project(":common")) { transitive = false }

    def platforms = rootProject.enabled_platforms.split(",")

    for (int i = 0; i < platforms.size(); i++) {
        shadowOnly(project(":${platforms[i]}")) {
            transitive = false
        }
    }
}

java {
    withSourcesJar()
}

tasks.named("sourcesJar").configure {
    archiveBaseName.set(rootProject.archives_base_name)
    archiveClassifier.set('sources')

    exclude { details ->
        details.file.toPath().startsWith(hashGeneratedDir.get().asFile.toPath())
    }
}

shadowJar {
    dependsOn processResources

    archiveBaseName.set(rootProject.archives_base_name)
    archiveClassifier.set('seed')
    zip64 true

    configurations = [project.configurations.shadowOnly]

    includeEmptyDirs = false

    exclude 'org/objectweb/asm/**'
    exclude 'META-INF/maven/**'
    exclude "didimisssomething.sha256"

    relocate 'net.minidev.json', "${rootProject.group}.shadow.json"
    relocate 'net.minidev.asm', "${rootProject.group}.shadow.minidev.asm"
}

tasks.register("seedJar", Jar) {
    dependsOn tasks.named("shadowJar"), tasks.named("remapJar")

    from({ zipTree(tasks.named("shadowJar", Jar).get().archiveFile.get().asFile) })
    exclude "didimisssomething.sha256"
    archiveBaseName.set(rootProject.archives_base_name)
    archiveClassifier.set("seed")
    includeEmptyDirs = false
}

tasks.register("generateSelfHash") {
    dependsOn tasks.named("shadowJar")

    outputs.upToDateWhen { false }

    outputs.file(hashGeneratedDir.map { it.file("didimisssomething.sha256") })

    doLast {
        def jarFile = tasks.named("shadowJar", Jar).get().archiveFile.get().asFile
        if (!jarFile.exists()) {
            throw new GradleException("Seed jar not found: ${jarFile}")
        }

        def digest = MessageDigest.getInstance("SHA-256")

        def entries = new JarFile(jarFile).withCloseable { jar ->
//            println Collections.list(jar.entries())
            Collections.list(jar.entries()).stream()
                    .filter { it.name != "didimisssomething.sha256" }
                    .sorted(Comparator.comparing { it.name })
                    .toList()
        }

        def jar = new JarFile(jarFile)
        try {
            byte[] buffer = new byte[8192]
            for (entry in entries) {
                digest.update(entry.name.getBytes(StandardCharsets.UTF_8))
//                println entry.name
                jar.getInputStream(entry).withCloseable { is ->
                    int read
                    while ((read = is.read(buffer)) != -1) {
//                        def hash = digest.digest().collect { String.format("%02x", it) }.join("")
//                        println hash
                        digest.update(buffer, 0, read)
                    }
                }
            }
        } finally {
            jar.close()
        }

        def hash = digest.digest().collect { String.format("%02x", it) }.join("")
        def outFile = hashGeneratedDir.get().file("didimisssomething.sha256").asFile
        outFile.parentFile.mkdirs()
        outFile.text = hash + System.lineSeparator()
        println "Generated didimisssomething.sha256: ${hash}"
    }
}

tasks.register('copySelfHashToResources', Copy) {
    dependsOn tasks.named("generateSelfHash")

    from hashGeneratedDir.get().file("didimisssomething.sha256").asFile
    into rootProject.file('common/src/main/resources')
    rename { "didimisssomething.sha256" }
}

tasks.register("finalJar", Jar) {
    dependsOn tasks.named("shadowJar"), tasks.named("copySelfHashToResources")

    archiveBaseName.set(rootProject.archives_base_name)
    archiveClassifier.set("")
    includeEmptyDirs = false

    from({ zipTree(tasks.named("shadowJar", Jar).get().archiveFile.get().asFile) })

    from(hashGeneratedDir) {
        include "didimisssomething.sha256"
    }

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.build.dependsOn finalJar

if (project.hasProperty('repsyUsername')) {
    publishing {
        publications {
            create("mavenJava", MavenPublication) {
                groupId = rootProject.maven_group
                artifactId = rootProject.archives_base_name
                version = project.version

                artifact(finalJar) {
                    builtBy(finalJar)
                }
                artifact(sourcesJar)
            }
        }

        repositories {
            maven {
                url = version.toString().contains("snapshot") || version.toString().contains("unstable") ?
                        "https://repo.repsy.io/mvn/arukusuiinpu/central/snapshots" :
                        "https://repo.repsy.io/mvn/arukusuiinpu/central/releases"
                credentials {
                    username = repsyUsername
                    password = repsyPassword
                }
            }
        }
    }

    tasks.named("publish").configure {
        doLast {
            println "Artifacts published in 'mavenJava' publication:"
            publishing.publications.mavenJava.artifacts.each { artifact ->
                println " - file: ${artifact.file}, type: ${artifact.extension}, classifier: ${artifact.classifier ?: 'none'}"
            }
        }
    }
}