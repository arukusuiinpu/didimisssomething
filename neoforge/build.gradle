import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_loader_version}"

    common(project(path: ":entrypoint", configuration: "namedElements"))
    shadowBundle project(path: ':entrypoint', configuration: 'transformProductionNeoForge')
    shadowBundle project(path: ":common")
}

processResources {
    inputs.property "version", rootProject.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": rootProject.version
    }
}

tasks.register('shadowJar', ShadowJar) {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}