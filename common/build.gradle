dependencies {
    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
        it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${project.yarn_mappings_patch_neoforge_version}")
    }

    implementation "net.minidev:json-smart:${rootProject.json_smart_version}"
    implementation "net.minidev:accessors-smart:${rootProject.json_smart_version}"

    // Source: https://mvnrepository.com/artifact/com.google.code.gson/gson
    implementation "com.google.code.gson:gson:${rootProject.gson_version}"
}

def includeLibsWith(name) {
    configurations.runtimeClasspath.findAll { it.name.contains(name) }.collect {
        it.isDirectory() ? it : zipTree(it)
    }
}

jar {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    from({ includeLibsWith("gson") })
}