plugins {
    id 'dev.architectury.loom' version '1.11-SNAPSHOT' apply false
    id 'architectury-plugin' version '3.5-SNAPSHOT'
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

def modVersion = rootProject.mod_version

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = modVersion
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'
    apply plugin: 'com.gradleup.shadow'

    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://files.minecraftforge.net/maven'
        }
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Quilt'
            url = 'https://maven.quiltmc.org/repository/release'
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"

        implementation "net.minidev:json-smart:${rootProject.json_smart_version}"
        implementation "net.minidev:accessors-smart:${rootProject.json_smart_version}"
    }

    java {
        withSourcesJar()

        sourceCompatibility = JavaVersion.toVersion(Integer.parseInt(rootProject.java_version))
        targetCompatibility = JavaVersion.toVersion(Integer.parseInt(rootProject.java_version))

        toolchain {
            languageVersion = JavaLanguageVersion.of(Integer.parseInt(rootProject.java_version))
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = Integer.parseInt(rootProject.java_version)
    }
}