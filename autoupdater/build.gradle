plugins {
    id 'java'
}

def modVersion = rootProject.mod_version

version = modVersion

dependencies {
    implementation "commons-io:commons-io:${rootProject.commons_io_version}"
    implementation "com.googlecode.juniversalchardet:juniversalchardet:${rootProject.juniversalchardet_version}"

    implementation "net.minidev:json-smart:${rootProject.json_smart_version}"
    implementation "net.minidev:accessors-smart:${rootProject.json_smart_version}"

    implementation project(path: ":common")
}

def includeLibsWith(name) {
    configurations.runtimeClasspath.findAll { it.name.contains(name) }.collect {
        it.isDirectory() ? it : zipTree(it)
    }
}

jar {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    manifest {
        attributes 'Main-Class': 'norivensuu.autoupdater.Main'
    }

    from({ includeLibsWith('commons-io') })
    from({ includeLibsWith('juniversalchardet') })
    from({ includeLibsWith('json-smart') })
    from({ includeLibsWith('accessors-smart') })
    from({ includeLibsWith('common-' + version) })

    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

jar.dependsOn project(":common").tasks.named("remapJar")

test {
    useJUnitPlatform()
}

tasks.register('copyJarToEntryResources', Copy) {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    from jar.archiveFile
    into rootProject.file('entrypoint/src/main/resources')
    rename { "autoupdater.jar" }

    dependsOn jar
}

tasks.register('copyJarToResources', Copy) {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)

    from jar.archiveFile
    into rootProject.file('didimisssomething/src/main/resources')
    rename { "autoupdater.jar" }

    dependsOn tasks.named("copyJarToEntryResources")
}

build.dependsOn copyJarToResources