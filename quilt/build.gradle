import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

architectury {
	platformSetupLoomIde()
	loader("quilt")
}

configurations {
	common {
		canBeResolved = true
		canBeConsumed = false
	}
	compileClasspath.extendsFrom common
	runtimeClasspath.extendsFrom common
	developmentQuilt.extendsFrom common

	// Files in this configuration will be bundled into your mod using the Shadow plugin.
	// Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
	shadowBundle {
		canBeResolved = true
		canBeConsumed = false
	}
}

dependencies {
	modImplementation "org.quiltmc:quilt-loader:${rootProject.quilt_loader_version}"

	mappings loom.layered {
		it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
		it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${project.yarn_mappings_patch_neoforge_version}")
	}

	common(project(path: ':entrypoint', configuration: 'namedElements'))
	shadowBundle project(path: ':common', configuration: 'transformProductionQuilt')
	shadowBundle project(path: ":common")
}

processResources {
	inputs.property "group", rootProject.maven_group
	inputs.property "version", rootProject.version

	filesMatching("quilt.mod.json") {
		expand "group": rootProject.maven_group,
				"version": rootProject.version
	}
}

tasks.register('shadowJar', ShadowJar) {
	configurations = [project.configurations.shadowBundle]
	archiveClassifier = 'dev-shadow'
}
